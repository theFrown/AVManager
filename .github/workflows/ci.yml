name: CI
on:
  push:
    branches: [ "main" ]
  pull_request:
permissions:
  contents: read
jobs:
  ci:
    name: ${{ matrix.preset }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [windows-debug, windows-release, windows-test-debug, windows-test-release]
    steps:
      - name: Checkout the repo
        uses: actions/checkout@v7
      - name: Run CI powershell script
        run: scripts/ci.ps1 -Preset ${{ matrix.preset }}
